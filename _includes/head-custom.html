<!-- 覆盖 just-the-docs 主题的 _includes/head-custom.html。

     注意一：主题的 _layouts/default.html 中已经调用过 seo 标签，
     此处绝不可再调用一次，否则会输出两份 title / description / og 标签。

     注意二：Liquid 在渲染时不区分 HTML 注释，写在注释里的 Liquid 标签
     同样会被执行。因此本文件的注释中一律不出现 Liquid 标签字面量，
     确需说明时请改用 raw 标签包裹。 -->

<style>
  /* just-the-docs 的字体栈为 system-ui 系列，已包含中文回退，
     但未显式指定中文字体，部分 Windows 浏览器会选到字形较差的宋体，
     此处把苹方 / 微软雅黑显式前置。
     主题的正文容器类名为 .main-content（连字符，区别于 slate 的 #main_content） */
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", Helvetica, Arial, sans-serif;
  }

  /* 中文段落在主题默认 line-height 下偏挤 */
  .main-content p,
  .main-content li {
    line-height: 1.8;
  }

  /* 中文标题不需要主题为西文设计的紧凑字距 */
  .main-content h1,
  .main-content h2,
  .main-content h3,
  .main-content h4,
  .main-content h5,
  .main-content h6 {
    letter-spacing: normal;
  }

  /* 代码块保持等宽字体，不被上面的中文字体栈影响；
     长命令行横向滚动而非折行，避免命令被折断后被误复制 */
  .main-content pre,
  .main-content code {
    font-family: "SFMono-Regular", Consolas, "Liberation Mono", Menlo,
      monospace;
  }

  .main-content pre {
    overflow-x: auto;
  }

  /* 侧边栏导航项也需要中文字体 */
  .site-nav,
  .site-title,
  .site-footer {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", Helvetica, Arial, sans-serif;
  }
</style>
