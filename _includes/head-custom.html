<!-- 覆盖 slate 主题自带的 _includes/head-custom.html。

     注意一：主题的 _layouts/default.html 中已经调用过 seo 标签，
     此处绝不可再调用一次，否则会输出两份 title / description / og 标签。

     注意二：Liquid 在渲染时不区分 HTML 注释，写在注释里的 Liquid 标签
     同样会被执行。因此本文件的注释中一律不出现 Liquid 标签字面量，
     确需说明时请改用 raw 标签包裹。 -->

<!-- 保留主题原有的 Google Analytics 挂载点，避免覆盖后丢失该功能 -->
{% include head-custom-google-analytics.html %}

<style>
  /* slate 主题 body 字体栈为 'Myriad Pro', Calibri, Helvetica, Arial，
     不含任何中文字体，中文会退化为系统默认字体，此处补上中文字体栈。
     内容区容器 id 为 main_content（下划线，见主题 default.html） */
  body,
  #main_content p,
  #main_content li,
  #main_content td {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Myriad Pro", Calibri, Helvetica,
      Arial, sans-serif;
  }

  /* 标题同样需要中文字体，否则与正文字形不一致 */
  #main_content h1,
  #main_content h2,
  #main_content h3,
  #main_content h4,
  #main_content h5,
  #main_content h6 {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC",
      "Hiragino Sans GB", "Microsoft YaHei", "Lucida Grande", Calibri, Helvetica,
      Arial, sans-serif;
    /* 主题设了 letter-spacing: -1px，中文标题会显得拥挤 */
    letter-spacing: normal;
  }

  /* 主题正文 line-height 为 1.5，中文段落偏挤 */
  #main_content p,
  #main_content li {
    line-height: 1.8;
  }

  /* 长命令行在窄屏下横向滚动而非折行，避免命令被折断后被误复制 */
  #main_content pre {
    overflow-x: auto;
    line-height: 1.5;
  }

  /* 分类之间的 <hr> 在原主题中几乎不可见，加强分隔感 */
  #main_content hr {
    height: 1px;
    border: 0;
    background: #d5d5d5;
    margin: 2em 0;
  }
</style>
